services:
  # ── Backend (Flask API) ─────────────────────────────────────
  - type: web
    name: earthpulse-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend (React/Vite static site) ──────────────────────
  - type: web
    name: earthpulse-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # IMPORTANT: Replace with your actual backend Render URL after deploying backend
      - key: VITE_API_BASE_URL
        value: https://earthpulse-ai-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
